name: Desktop installers
# Builds the macOS and Linux apps for every release tag and attaches them to
# the GitHub Release. The Windows installer is built locally.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*-mac-*.zip dist/*.AppImage dist/*.deb dist/*.pacman)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Folio $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
