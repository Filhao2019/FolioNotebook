name: Desktop installers
# Builds the Windows, macOS and Linux apps for every release tag and attaches
# them to the GitHub Release. Every release must ship all three (see AGENTS.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged macOS signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          for arch in arm64 x64; do
            extracted=$(mktemp -d)
            ditto -x -k "dist/Folio-${version}-mac-${arch}.zip" "$extracted"
            codesign --verify --deep --strict --verbose=2 "$extracted/Folio.app"
          done
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s nullglob
          files=(dist/Folio-Setup-*.exe dist/*.dmg dist/*-mac-*.zip dist/*.AppImage dist/*.deb dist/*.pacman)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Folio $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish only with all eight installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/assets.json"
          for file in \
            "Folio-Setup-${version}.exe" \
            "Folio-${version}-mac-arm64.dmg" \
            "Folio-${version}-mac-arm64.zip" \
            "Folio-${version}-mac-x64.dmg" \
            "Folio-${version}-mac-x64.zip" \
            "Folio-${version}-linux-x86_64.AppImage" \
            "Folio-${version}-linux-amd64.deb" \
            "Folio-${version}-linux-x64.pacman"; do
            jq -e --arg name "$file" 'any(.assets[]; .name == $name and .size > 0)' "$RUNNER_TEMP/assets.json"
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
